openapi: 3.1.0
info:
  title: OssPilot Tenant API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Tenant portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [tenant] }
      responses:
        "200":
          description: JWT; includes must_change_password
        "401":
          description: bad credentials
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current user
      responses:
        "200":
          description: profile including must_change_password
  /api/password/change:
    post:
      summary: Change password
      responses:
        "204":
          description: changed
  /api/buckets:
    get:
      summary: List buckets
      responses:
        "200":
          description: items
    post:
      summary: Create bucket metadata
      responses:
        "201":
          description: created
  /api/buckets/{bucket_name}:
    get:
      summary: Get bucket
      responses:
        "200":
          description: detail
    put:
      summary: Update bucket metadata
      responses:
        "200":
          description: detail
    delete:
      summary: Delete bucket metadata
      responses:
        "204":
          description: deleted
