openapi: 3.1.0
info:
  title: OssPilot Tenant API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Tenant portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [tenant] }
      responses:
        "200":
          description: JWT; includes must_change_password
        "401":
          description: bad credentials
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current user
      responses:
        "200":
          description: profile including must_change_password
  /api/password/change:
    post:
      summary: Change password
      responses:
        "204":
          description: changed
  /api/buckets:
    get:
      summary: List buckets
      responses:
        "200":
          description: items
    post:
      summary: Create bucket metadata
      responses:
        "201":
          description: created
  /api/buckets/{bucket_name}:
    get:
      summary: Get bucket
      responses:
        "200":
          description: detail
    put:
      summary: Update bucket metadata
      responses:
        "200":
          description: detail
    delete:
      summary: Delete bucket metadata
      responses:
        "204":
          description: deleted
  /api/buckets/{bucket_name}/policy:
    get:
      summary: Get S3 bucket policy
      responses:
        "200":
          description: policy or empty
    put:
      summary: Replace S3 bucket policy
      responses:
        "200":
          description: saved
        "400":
          description: invalid policy
    delete:
      summary: Delete S3 bucket policy
      responses:
        "204":
          description: deleted
  /api/buckets/{bucket_name}/cors:
    get:
      summary: Get bucket CORS rules
      responses:
        "200":
          description: rules
    put:
      summary: Replace bucket CORS rules
      responses:
        "200":
          description: saved
        "400":
          description: invalid rules
    delete:
      summary: Delete bucket CORS
      responses:
        "204":
          description: deleted
  /api/buckets/{bucket_name}/objects:
    get:
      summary: List object metadata
      responses:
        "200":
          description: items and prefixes
  /api/buckets/{bucket_name}/objects/detail:
    get:
      summary: Object metadata
      responses:
        "200":
          description: detail
  /api/buckets/{bucket_name}/objects/directories:
    post:
      summary: Create directory placeholder
      responses:
        "200":
          description: created
  /api/uploads/presign:
    post:
      summary: Presign PUT upload
      responses:
        "200":
          description: url and headers
  /api/uploads/complete:
    post:
      summary: Finalize simple upload
      responses:
        "200":
          description: object metadata
  /api/uploads/multipart/init:
    post:
      summary: Start multipart upload
      responses:
        "200":
          description: upload_id
  /api/uploads/multipart/parts:
    post:
      summary: Presign multipart parts
      responses:
        "200":
          description: part urls
  /api/uploads/multipart/complete:
    post:
      summary: Complete multipart upload
      responses:
        "200":
          description: object metadata
  /api/uploads/multipart/abort:
    post:
      summary: Abort multipart upload
      responses:
        "200":
          description: aborted
  /api/downloads/presign:
    post:
      summary: Presign GET download
      responses:
        "200":
          description: url
  /api/downloads/batch:
    post:
      summary: Batch presign GET
      responses:
        "200":
          description: items
  /api/login-branding:
    get:
      summary: Public tenant login branding
      responses:
        "200":
          description: logo_text, title, subtitle
  /api/platform-config:
    get:
      summary: Effective storage/CDN config
      responses:
        "200":
          description: region, endpoints, trash policy
        "401":
          description: missing or invalid token
  /internal/accounts/{username}:
    put:
      summary: Upsert a tenant account projected from ops
      responses:
        "204":
          description: upserted
        "401":
          description: bad projection secret
    delete:
      summary: Delete a projected tenant account
      responses:
        "204":
          description: deleted
  /internal/accounts/{username}/buckets:
    put:
      summary: Replace ops-sourced bucket grants
      responses:
        "204":
          description: replaced
        "404":
          description: account missing
  /api/versions:
    get:
      summary: List archived versions of an object
      responses:
        "200":
          description: items and total
  /api/versions/{version_id}:
    get:
      summary: Version metadata
      responses:
        "200":
          description: summary
        "404":
          description: not found
    delete:
      summary: Delete an archived version
      responses:
        "200":
          description: deleted
  /api/versions/{version_id}/download:
    post:
      summary: Presign GET for an archived version
      responses:
        "200":
          description: url
  /api/versions/{version_id}/restore:
    post:
      summary: Restore an archived version onto the live key
      responses:
        "200":
          description: restored
