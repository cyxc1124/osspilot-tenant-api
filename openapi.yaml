openapi: 3.1.0
info:
  title: OssPilot Tenant API
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Liveness
      responses:
        "200":
          description: ok
  /api/login:
    post:
      summary: Tenant portal login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                portal: { type: string, enum: [tenant] }
      responses:
        "200":
          description: JWT; includes must_change_password
        "401":
          description: bad credentials
  /api/logout:
    post:
      summary: Stateless logout
      responses:
        "200":
          description: client should discard token
  /api/me:
    get:
      summary: Current user
      responses:
        "200":
          description: profile including must_change_password
  /api/password/change:
    post:
      summary: Change password
      responses:
        "204":
          description: changed
  /api/buckets:
    get:
      summary: List buckets
      responses:
        "200":
          description: items
    post:
      summary: Create bucket metadata
      responses:
        "201":
          description: created
  /api/buckets/{bucket_name}:
    get:
      summary: Get bucket
      responses:
        "200":
          description: detail
    put:
      summary: Update bucket metadata
      responses:
        "200":
          description: detail
    delete:
      summary: Delete bucket metadata
      responses:
        "204":
          description: deleted
  /api/buckets/{bucket_name}/objects:
    get:
      summary: List object metadata
      responses:
        "200":
          description: items and prefixes
  /api/buckets/{bucket_name}/objects/detail:
    get:
      summary: Object metadata
      responses:
        "200":
          description: detail
  /api/buckets/{bucket_name}/objects/directories:
    post:
      summary: Create directory placeholder
      responses:
        "200":
          description: created
  /api/uploads/presign:
    post:
      summary: Presign PUT upload
      responses:
        "200":
          description: url and headers
  /api/uploads/complete:
    post:
      summary: Finalize simple upload
      responses:
        "200":
          description: object metadata
  /api/uploads/multipart/init:
    post:
      summary: Start multipart upload
      responses:
        "200":
          description: upload_id
  /api/uploads/multipart/parts:
    post:
      summary: Presign multipart parts
      responses:
        "200":
          description: part urls
  /api/uploads/multipart/complete:
    post:
      summary: Complete multipart upload
      responses:
        "200":
          description: object metadata
  /api/uploads/multipart/abort:
    post:
      summary: Abort multipart upload
      responses:
        "200":
          description: aborted
  /api/downloads/presign:
    post:
      summary: Presign GET download
      responses:
        "200":
          description: url
  /api/downloads/batch:
    post:
      summary: Batch presign GET
      responses:
        "200":
          description: items
